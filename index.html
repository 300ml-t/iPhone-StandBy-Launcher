<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<meta name="apple-mobile-web-app-capable"
      content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent">

<meta name="theme-color"
      content="#000000">

<title>iPhone StandBy Launcher</title>

<style>

/* =====================================================
   BASIC
===================================================== */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;

  background: #000;
  color: white;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    Arial,
    sans-serif;

  user-select: none;
}

body {
  touch-action: pan-y;
}


/* =====================================================
   STARTUP
===================================================== */

#startup {

  position: fixed;
  inset: 0;

  z-index: 9999;

  display: flex;

  align-items: center;
  justify-content: center;

  flex-direction: column;

  background: #000;

  animation:
    startupFade .8s ease 2.3s forwards;
}


.start-logo {

  width: 90px;
  height: 90px;

  border:
    3px solid white;

  border-radius: 26px;

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 50px;
  font-weight: 700;

  animation:
    logoIn 1s cubic-bezier(.2,.8,.2,1),
    logoGlow 1.5s ease-in-out infinite alternate;
}


.start-title {

  margin-top: 25px;

  font-size: 20px;

  letter-spacing: 5px;

  font-weight: 600;

  opacity: 0;

  animation:
    titleIn .8s ease .6s forwards;
}


.start-subtitle {

  margin-top: 10px;

  font-size: 11px;

  letter-spacing: 3px;

  opacity: 0;

  animation:
    titleIn .8s ease 1s forwards;
}


@keyframes logoIn {

  from {
    transform:
      scale(.3)
      rotate(-20deg);

    opacity: 0;
  }

  to {
    transform:
      scale(1)
      rotate(0);

    opacity: 1;
  }

}


@keyframes logoGlow {

  from {
    box-shadow:
      0 0 10px
      rgba(255,255,255,.15);
  }

  to {
    box-shadow:
      0 0 35px
      rgba(255,255,255,.45);
  }

}


@keyframes titleIn {

  from {
    transform:
      translateY(15px);

    opacity: 0;
  }

  to {
    transform:
      translateY(0);

    opacity: 1;
  }

}


@keyframes startupFade {

  to {
    opacity: 0;

    visibility: hidden;

    pointer-events: none;
  }

}


/* =====================================================
   ROTATE WARNING
===================================================== */

#rotateWarning {

  display: none;
}


@media screen
and (orientation: portrait)
and (max-width: 900px) {

  #rotateWarning {

    position: fixed;
    inset: 0;

    z-index: 10000;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    text-align: center;

    padding: 30px;

    background: #000;
  }


  #rotateWarning .rotate-icon {

    width: 90px;
    height: 55px;

    border:
      3px solid white;

    border-radius: 10px;

    transform:
      rotate(90deg);

    margin-bottom: 30px;
  }


  #rotateWarning h1 {

    margin: 0 0 12px;

    font-size: 24px;
  }


  #rotateWarning p {

    margin: 0;

    color:
      rgba(255,255,255,.55);

    font-size: 14px;

    line-height: 1.7;
  }


  #app {

    display: none;
  }

}


/* =====================================================
   APP
===================================================== */

#app {

  position: fixed;
  inset: 0;

  display: flex;

  background:
    radial-gradient(
      circle at 30% 50%,
      rgba(255,255,255,.04),
      transparent 45%
    ),

    #000;
}


/* =====================================================
   LEFT CLOCK
===================================================== */

.clock-side {

  width: 50%;
  height: 100%;

  display: flex;

  flex-direction: column;

  justify-content: center;

  padding:
    5vw;
}


.clock {

  display: flex;

  align-items: center;

  font-size:
    clamp(
      55px,
      8vw,
      145px
    );

  font-weight: 200;

  letter-spacing: -5px;

  line-height: 1;
}


.digit {

  display: inline-block;

  min-width: .58em;

  text-align: center;

  transition:
    transform .22s ease,
    opacity .22s ease;
}


.colon {

  min-width: .35em;

  text-align: center;

  opacity: .45;
}


.date {

  margin-top: 30px;

  font-size:
    clamp(
      16px,
      1.8vw,
      28px
    );

  color:
    rgba(255,255,255,.82);
}


.greeting {

  margin-top: 8px;

  font-size:
    clamp(
      13px,
      1.2vw,
      18px
    );

  color:
    rgba(255,255,255,.42);
}


/* =====================================================
   RIGHT CONTENT
===================================================== */

.content-side {

  width: 50%;
  height: 100%;

  padding: 3.5vw;

  display: flex;

  align-items: center;
  justify-content: center;

  overflow: hidden;
}


.pages {

  width: 100%;
  height: 100%;

  display: flex;

  transition:
    transform
    .55s
    cubic-bezier(.22,.61,.36,1);
}


/* =====================================================
   SINGLE WIDGET PAGE
===================================================== */

.page {

  position: relative;

  flex:
    0 0 100%;

  width: 100%;
  height: 100%;

  padding: 4px;

  display: flex;

  align-items: stretch;
}


.widget {

  position: relative;

  width: 100%;
  height: 100%;

  overflow: hidden;

  border-radius: 32px;

  border:
    1px solid
    rgba(255,255,255,.10);

  background:
    rgba(255,255,255,.075);

  box-shadow:
    0 15px 50px
    rgba(0,0,0,.35);

  backdrop-filter:
    blur(30px);

  -webkit-backdrop-filter:
    blur(30px);
}


/* =====================================================
   WIDGET OVERLAY
===================================================== */

.widget::after {

  content: "";

  position: absolute;

  inset: 0;

  pointer-events: none;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.06),
      transparent 35%,
      rgba(0,0,0,.20)
    );
}


/* =====================================================
   WEATHER
===================================================== */

.weather {

  background:
    linear-gradient(
      135deg,
      #1d2630,
      #111820
    );

  background-size: cover;

  background-position: center;

  transition:
    background-image .7s ease;
}


.weather::before {

  content: "";

  position: absolute;

  inset: 0;

  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.05),
      rgba(0,0,0,.65)
    );
}


.weather-content {

  position: relative;

  z-index: 2;

  width: 100%;
  height: 100%;

  padding: 35px;

  display: flex;

  flex-direction: column;
}


.weather-location {

  font-size: 17px;

  color:
    rgba(255,255,255,.8);
}


.weather-main {

  margin-top: auto;
}


.weather-temp {

  font-size:
    clamp(
      90px,
      11vw,
      180px
    );

  font-weight: 200;

  line-height: .9;

  letter-spacing: -5px;
}


.weather-description {

  margin-top: 20px;

  font-size:
    clamp(
      20px,
      2.3vw,
      36px
    );
}


.weather-extra {

  display: flex;

  flex-wrap: wrap;

  gap: 20px;

  margin-top: 25px;

  font-size: 14px;

  color:
    rgba(255,255,255,.70);
}


/* =====================================================
   MUSIC
===================================================== */

.music {

  background:
    radial-gradient(
      circle at 50% 30%,
      rgba(100,100,100,.25),
      transparent 50%
    ),

    linear-gradient(
      135deg,
      #1c1c1e,
      #090909
    );
}


.music-content {

  position: relative;

  z-index: 2;

  width: 100%;
  height: 100%;

  padding: 35px;

  display: flex;

  flex-direction: column;
}


.widget-label {

  font-size: 16px;

  color:
    rgba(255,255,255,.55);

  letter-spacing: .5px;
}


.music-center {

  flex: 1;

  display: flex;

  align-items: center;
  justify-content: center;

  flex-direction: column;

  text-align: center;
}


.music-coming {

  font-size:
    clamp(
      30px,
      4vw,
      65px
    );

  font-weight: 500;
}


.music-sub {

  margin-top: 15px;

  font-size: 15px;

  color:
    rgba(255,255,255,.45);
}


/* =====================================================
   NEWS
===================================================== */

.news {

  background:
    linear-gradient(
      135deg,
      #18202b,
      #10151c
    );

  background-size: cover;

  background-position: center;
}


.news::before {

  content: "";

  position: absolute;

  inset: 0;

  background:
    linear-gradient(
      90deg,
      rgba(0,0,0,.88),
      rgba(0,0,0,.25)
    );
}


.news-content {

  position: relative;

  z-index: 2;

  width: 100%;
  height: 100%;

  padding: 35px;

  display: flex;

  flex-direction: column;

  justify-content: flex-end;
}


.news-source {

  font-size: 15px;

  color:
    rgba(255,255,255,.65);

  margin-bottom: 15px;
}


.news-headline {

  max-width: 90%;

  font-size:
    clamp(
      25px,
      3vw,
      48px
    );

  line-height: 1.25;

  font-weight: 600;
}


.news-detail {

  max-width: 85%;

  margin-top: 15px;

  font-size: 14px;

  line-height: 1.7;

  color:
    rgba(255,255,255,.68);
}


.news-link {

  display: block;

  width: fit-content;

  margin-top: 20px;

  padding:
    10px 17px;

  border-radius: 30px;

  color: white;

  background:
    rgba(255,255,255,.14);

  text-decoration: none;

  font-size: 13px;
}


/* =====================================================
   CALENDAR
===================================================== */

.calendar {

  background:
    linear-gradient(
      135deg,
      #15171b,
      #08090b
    );
}


.calendar-content {

  position: relative;

  z-index: 2;

  width: 100%;
  height: 100%;

  padding: 35px;

  display: flex;

  flex-direction: column;
}


.calendar-label {

  font-size: 16px;

  color:
    rgba(255,255,255,.5);
}


.calendar-date-big {

  margin-top: 15px;

  font-size:
    clamp(
      30px,
      4vw,
      65px
    );

  font-weight: 500;
}


.calendar-divider {

  width: 100%;
  height: 1px;

  margin-top: 25px;

  background:
    rgba(255,255,255,.12);
}


.calendar-empty {

  flex: 1;

  display: flex;

  align-items: center;
  justify-content: center;

  text-align: center;

  color:
    rgba(255,255,255,.45);

  font-size: 18px;

  line-height: 1.8;
}


/* =====================================================
   PAGE DOTS
===================================================== */

.page-indicator {

  position: fixed;

  right: 30px;
  bottom: 25px;

  z-index: 50;

  display: flex;

  gap: 8px;
}


.dot {

  width: 7px;
  height: 7px;

  border-radius: 50%;

  background:
    rgba(255,255,255,.25);

  transition:
    .3s ease;
}


.dot.active {

  background: white;

  transform:
    scale(1.3);
}


/* =====================================================
   FULLSCREEN
===================================================== */

#fullscreenBtn {

  position: fixed;

  right: 25px;
  top: 25px;

  z-index: 100;

  width: 42px;
  height: 42px;

  border:
    1px solid
    rgba(255,255,255,.15);

  border-radius: 50%;

  background:
    rgba(255,255,255,.08);

  color: white;

  font-size: 18px;

  cursor: pointer;
}


/* =====================================================
   NIGHT MODE
===================================================== */

body.night {

  background: #080300;
}


body.night #app {

  filter:
    sepia(.75)
    saturate(.65);
}


/* =====================================================
   SMALL LANDSCAPE
===================================================== */

@media (max-height: 600px) {

  .clock-side {

    padding: 4vw;
  }


  .date {

    margin-top: 15px;
  }


  .weather-content,
  .music-content,
  .news-content,
  .calendar-content {

    padding: 25px;
  }


  .news-detail {

    display: none;
  }


  .weather-extra {

    margin-top: 15px;
  }

}


/* =====================================================
   LARGE IPAD
===================================================== */

@media (min-width: 1000px) {

  .clock-side {

    padding-left: 6vw;
  }


  .content-side {

    padding: 4vw;
  }

}

</style>
</head>


<body>


<!-- =====================================================
     ROTATE WARNING
===================================================== -->

<div id="rotateWarning">

  </h1>

<script>
window.addEventListener("error", function(e) {
  console.error("StandBy Launcher error:", e.error || e.message);
});


/* =====================================================
   CLOCK
===================================================== */

const digits = {

  h1:
    document.getElementById("h1"),

  h2:
    document.getElementById("h2"),

  m1:
    document.getElementById("m1"),

  m2:
    document.getElementById("m2"),

  s1:
    document.getElementById("s1"),

  s2:
    document.getElementById("s2")

};


let previousTime = {};


function updateClock() {

  const now =
    new Date();


  const time = [

    String(
      now.getHours()
    ).padStart(2, "0"),

    String(
      now.getMinutes()
    ).padStart(2, "0"),

    String(
      now.getSeconds()
    ).padStart(2, "0")

  ].join("");


  const ids = [

    "h1",
    "h2",
    "m1",
    "m2",
    "s1",
    "s2"

  ];


  ids.forEach(
    (id, index) => {

      const value =
        time[index];


      if (
        previousTime[id] !== value
      ) {

        const element =
          digits[id];


        element.style.transform =
          "translateY(-8px)";

        element.style.opacity =
          "0";


        setTimeout(
          () => {

            element.textContent =
              value;

            element.style.transform =
              "translateY(0)";

            element.style.opacity =
              "1";

          },
          80
        );

      }


      previousTime[id] =
        value;

    }
  );


  updateDate(now);
  updateGreeting(now);

}


function updateDate(now) {

  const weekdays = [

    "日",
    "月",
    "火",
    "水",
    "木",
    "金",
    "土"

  ];


  document.getElementById(
    "date"
  ).textContent =

    `${now.getFullYear()}年` +
    `${now.getMonth()+1}月` +
    `${now.getDate()}日` +
    `（${weekdays[now.getDay()]}）`;


  document.getElementById(
    "calendarDate"
  ).textContent =

    `${now.getMonth()+1}月` +
    `${now.getDate()}日`;

}


function updateGreeting(now) {

  const hour =
    now.getHours();


  let text;


  if (hour < 5) {

    text =
      "おやすみなさい";

  }

  else if (hour < 11) {

    text =
      "おはようございます";

  }

  else if (hour < 18) {

    text =
      "こんにちは";

  }

  else {

    text =
      "こんばんは";

  }


  document.getElementById(
    "greeting"
  ).textContent =
    text;

}


updateClock();

setInterval(
  updateClock,
  1000
);


/* =====================================================
   WEATHER
===================================================== */

const weatherDescriptions = {

  0: "快晴",
  1: "晴れ",
  2: "薄曇り",
  3: "曇り",

  45: "霧",
  48: "霧",

  51: "弱い霧雨",
  53: "霧雨",
  55: "強い霧雨",

  61: "弱い雨",
  63: "雨",
  65: "強い雨",

  71: "弱い雪",
  73: "雪",
  75: "強い雪",

  80: "にわか雨",
  81: "雨",
  82: "強いにわか雨",

  95: "雷雨",
  96: "雷雨",
  99: "雷雨"

};


const weatherBackgrounds = {

  clear:
    "url('https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1600&q=85')",

  cloudy:
    "url('https://images.unsplash.com/photo-1534088568595-a066f410bcda?auto=format&fit=crop&w=1600&q=85')",

  rain:
    "url('https://images.unsplash.com/photo-1515694346937-94d85e41e6f0?auto=format&fit=crop&w=1600&q=85')",

  snow:
    "url('https://images.unsplash.com/photo-1511131341194-24e1d27fca97?auto=format&fit=crop&w=1600&q=85')",

  thunder:
    "url('https://images.unsplash.com/photo-1461511669078-d46bf351cd6e?auto=format&fit=crop&w=1600&q=85')",

  fog:
    "url('https://images.unsplash.com/photo-1485236715568-ddc5ee6ca227?auto=format&fit=crop&w=1600&q=85')"

};


function getWeatherType(code) {

  if (
    code === 0 ||
    code === 1
  ) {

    return "clear";

  }


  if (
    code === 2 ||
    code === 3
  ) {

    return "cloudy";

  }


  if (
    code >= 45 &&
    code <= 48
  ) {

    return "fog";

  }


  if (
    code >= 51 &&
    code <= 65
  ) {

    return "rain";

  }


  if (
    code >= 71 &&
    code <= 75
  ) {

    return "snow";

  }


  if (
    code >= 80 &&
    code <= 82
  ) {

    return "rain";

  }


  if (code >= 95) {

    return "thunder";

  }


  return "cloudy";

}


function updateWeatherUI(data) {

  const current =
    data.current;

  const daily =
    data.daily;


  const code =
    current.weather_code;


  const type =
    getWeatherType(code);


  const background =
    weatherBackgrounds[type];


  document.getElementById(
    "weatherWidget"
  ).style.backgroundImage =
    background;


  document.getElementById(
    "weatherTemp"
  ).textContent =

    `${Math.round(
      current.temperature_2m
    )}°`;


  document.getElementById(
    "weatherDescription"
  ).textContent =

    weatherDescriptions[code]
    || "天気情報";


  document.getElementById(
    "weatherHighLow"
  ).textContent =

    `${Math.round(
      daily.temperature_2m_max[0]
    )} / ${Math.round(
      daily.temperature_2m_min[0]
    )}°`;


  document.getElementById(
    "weatherRain"
  ).textContent =

    `降水 ${
      daily
        .precipitation_probability_max[0]
    }%`;


  document.getElementById(
    "weatherHumidity"
  ).textContent =

    `湿度 ${
      Math.round(
        current.relative_humidity_2m
      )
    }%`;


  document.getElementById(
    "weatherWind"
  ).textContent =

    `風 ${
      Math.round(
        current.wind_speed_10m
      )
    } km/h`;

}


async function getWeather() {

  /*
    デフォルト地点
  */

  let latitude =
    34.8219;

  let longitude =
    135.4286;


  /*
    GPSが使える場合は
    現在地を使用
  */

  if (
    navigator.geolocation
  ) {

    try {

      const position =
        await new Promise(
          (resolve, reject) => {

            navigator.geolocation
              .getCurrentPosition(
                resolve,
                reject,
                {
                  enableHighAccuracy:
                    false,

                  timeout:
                    4000
                }
              );

          }
        );


      latitude =
        position.coords.latitude;

      longitude =
        position.coords.longitude;

    }

    catch (error) {

      console.log(
        "位置情報取得失敗"
      );

    }

  }


  const url =

    `https://api.open-meteo.com/v1/forecast` +

    `?latitude=${latitude}` +

    `&longitude=${longitude}` +

    `&current=` +

    `temperature_2m,` +
    `relative_humidity_2m,` +
    `weather_code,` +
    `wind_speed_10m` +

    `&daily=` +

    `temperature_2m_max,` +
    `temperature_2m_min,` +
    `precipitation_probability_max` +

    `&timezone=auto`;


  try {

    const response =
      await fetch(url);


    const data =
      await response.json();


    updateWeatherUI(data);

  }

  catch (error) {

    console.error(
      "Weather Error:",
      error
    );


    document.getElementById(
      "weatherDescription"
    ).textContent =
      "天気取得エラー";

  }

}


getWeather();


/*
  10分ごとに更新
*/

setInterval(
  getWeather,
  10 * 60 * 1000
);

/* =====================================================
   PAGE SYSTEM
===================================================== */

const pages =
  document.getElementById(
    "pages"
  );


const dots =
  document.querySelectorAll(
    ".dot"
  );


let currentPage = 0;


const totalPages = 4;


function showPage(index) {

  /*
    ループ
  */

  if (
    index < 0
  ) {

    index =
      totalPages - 1;

  }


  if (
    index >= totalPages
  ) {

    index = 0;

  }


  currentPage =
    index;


  pages.style.transform =
    `translateX(-${index * 100}%)`;


  dots.forEach(
    (dot, i) => {

      dot.classList.toggle(
        "active",
        i === index
      );

    }
  );

}


/* =====================================================
   AUTO SLIDE
===================================================== */

let autoSlide =
  setInterval(
    () => {

      showPage(
        currentPage + 1
      );

    },
    10000
  );


function resetAutoSlide() {

  clearInterval(
    autoSlide
  );


  autoSlide =
    setInterval(
      () => {

        showPage(
          currentPage + 1
        );

      },
      10000
    );

}


/* =====================================================
   SWIPE
===================================================== */

let touchStartX = 0;
let touchStartY = 0;


document.addEventListener(
  "touchstart",
  event => {

    touchStartX =
      event.changedTouches[0]
        .screenX;

    touchStartY =
      event.changedTouches[0]
        .screenY;

  },
  {
    passive: true
  }
);


document.addEventListener(
  "touchend",
  event => {

    const touch =
      event.changedTouches[0];


    const endX =
      touch.screenX;

    const endY =
      touch.screenY;


    const dx =
      endX - touchStartX;

    const dy =
      endY - touchStartY;


    /*
      横スワイプだけ反応
    */

    if (

      Math.abs(dx) > 60 &&

      Math.abs(dx) >
      Math.abs(dy)

    ) {

      if (
        dx < 0
      ) {

        showPage(
          currentPage + 1
        );

      }

      else {

        showPage(
          currentPage - 1
        );

      }


      resetAutoSlide();

    }

  },
  {
    passive: true
  }
);


/* =====================================================
   DOUBLE TAP NIGHT MODE
===================================================== */

let lastTap = 0;


document
  .getElementById("clock")
  .addEventListener(
    "touchend",
    () => {

      const now =
        Date.now();


      if (
        now - lastTap < 350
      ) {

        document.body
          .classList
          .toggle("night");

      }


      lastTap =
        now;

    }
  );


/* =====================================================
   WAKE LOCK
===================================================== */

let wakeLock = null;


async function requestWakeLock() {

  if (
    !("wakeLock" in navigator)
  ) {

    return;

  }


  try {

    wakeLock =
      await navigator
        .wakeLock
        .request("screen");


    console.log(
      "Wake Lock enabled"
    );

  }

  catch (error) {

    console.log(
      "Wake Lock unavailable"
    );

  }

}


requestWakeLock();


document.addEventListener(
  "visibilitychange",
  () => {

    if (
      document.visibilityState ===
      "visible"
    ) {

      requestWakeLock();

    }

  }
);


/* =====================================================
   FULLSCREEN
===================================================== */

document
  .getElementById(
    "fullscreenBtn"
  )
  .addEventListener(
    "click",
    async () => {

      try {

        if (
          !document.fullscreenElement
        ) {

          await document
            .documentElement
            .requestFullscreen();

        }

        else {

          await document
            .exitFullscreen();

        }

      }

      catch (error) {

        console.log(
          "Fullscreen unavailable"
        );

      }

    }
  );


/* =====================================================

===================================================== */

async function getBattery() {

  if (
    !("getBattery" in navigator)
  ) {

    return;

  }


  try {

    const battery =
      await navigator.getBattery();


    console.log(
      "Battery:",
      Math.round(
        battery.level * 100
      ) + "%"
    );

  }

  catch (error) {

    console.log(
      "Battery unavailable"
    );

  }

}


getBattery();


/* =====================================================

===================================================== */

setTimeout(
  requestWakeLock,
  3500
);
